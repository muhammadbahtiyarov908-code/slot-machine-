
<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Racing</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#07101c;font-family:Arial,sans-serif;color:white}
canvas{display:block;width:100vw;height:100vh}
#hud{position:fixed;top:15px;left:15px;z-index:5;display:flex;gap:10px;flex-wrap:wrap}
.panel{background:#07101cdd;border:1px solid #ffffff30;padding:10px 15px;border-radius:12px;font-weight:bold}
#speed{color:#00f5ff;font-size:23px}
#message{position:fixed;top:25%;left:50%;transform:translateX(-50%);font-size:30px;font-weight:bold;color:#00f5ff;text-shadow:0 0 15px #00f5ff;z-index:5;text-align:center;pointer-events:none}
#help{position:fixed;top:15px;right:15px;background:#07101cdd;padding:12px;border-radius:12px;font-size:12px;line-height:1.7;z-index:5}
#controls{position:fixed;bottom:20px;left:0;width:100%;display:flex;justify-content:space-between;padding:0 18px;z-index:10;pointer-events:none}
.group{display:flex;gap:10px;pointer-events:auto}
.control{width:62px;height:62px;border-radius:16px;border:1px solid #ffffff66;background:#142b45dd;color:white;font-size:24px;font-weight:bold;touch-action:none;user-select:none}
.control:active{background:#00a8ff}
#jump{background:#7b24cddd}
@media(min-width:850px){#controls{opacity:.65}.control{width:55px;height:55px}}
@media(max-width:600px){#help{top:auto;bottom:100px;right:10px;font-size:10px}.panel{padding:8px;font-size:12px}#speed{font-size:19px}#message{font-size:24px}}
</style>
</head>
<body>

<div id="hud">
 <div class="panel">TEZLIK: <span id="speed">0</span> km/h</div>
 <div class="panel">MASOFA: <span id="distance">0</span> m</div>
 <div class="panel">REKORD: <span id="record">0</span> m</div>
</div>

<div id="help">
 W / ↑ — Gaz<br>
 S / ↓ — Tormoz<br>
 A / D — Burilish<br>
 SPACE — Sakrash<br>
 SPACE × 2 — Uchish
</div>

<div id="message">3D RACING</div>

<div id="controls">
 <div class="group">
  <button class="control" id="left">←</button>
  <button class="control" id="right">→</button>
 </div>
 <div class="group">
  <button class="control" id="jump">↑</button>
  <button class="control" id="brake">▼</button>
  <button class="control" id="gas">▲</button>
 </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07101c);
scene.fog = new THREE.Fog(0x07101c,45,190);

const camera = new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);
camera.position.set(0,5.5,11);
camera.lookAt(0,1,-5);

const renderer = new THREE.WebGLRenderer({
 antialias:false,
 powerPreference:"high-performance"
});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xb9dfff,0x202030,2));
const sun=new THREE.DirectionalLight(0xffffff,1.5);
sun.position.set(-5,12,8);
scene.add(sun);

// Materiallar
const roadMat=new THREE.MeshStandardMaterial({color:0x242832,roughness:1});
const grassMat=new THREE.MeshStandardMaterial({color:0x102b20});
const whiteMat=new THREE.MeshBasicMaterial({color:0xffffff});
const darkMat=new THREE.MeshStandardMaterial({color:0x111722});
const glassMat=new THREE.MeshStandardMaterial({color:0x39a8d9,metalness:.3,roughness:.2});
const wheelMat=new THREE.MeshStandardMaterial({color:0x080808});

// Yer
const ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),grassMat);
ground.rotation.x=-Math.PI/2;
ground.position.y=-.13;
scene.add(ground);

// Yo'l
const road=new THREE.Mesh(new THREE.BoxGeometry(12,.15,300),roadMat);
road.position.set(0,-.05,-100);
scene.add(road);

for(const x of [-6,6]){
 const edge=new THREE.Mesh(new THREE.BoxGeometry(.18,.2,300),whiteMat);
 edge.position.set(x,.05,-100);
 scene.add(edge);
}

// Yo'l chiziqlari
const laneMarks=[];
for(let i=0;i<28;i++){
 const mark=new THREE.Mesh(new THREE.BoxGeometry(.13,.025,3),whiteMat);
 mark.position.set(0,.045,-i*10);
 scene.add(mark);
 laneMarks.push(mark);
}

// RGB chiroqlar
const lamps=[];
const poleMat=new THREE.MeshStandardMaterial({color:0x333b49});

for(let i=0;i<18;i++){
 for(const side of [-1,1]){
  const pole=new THREE.Mesh(new THREE.BoxGeometry(.16,5,.16),poleMat);
  pole.position.set(side*8,2.5,-i*15);
  scene.add(pole);

  const arm=new THREE.Mesh(new THREE.BoxGeometry(1.5,.13,.13),poleMat);
  arm.position.set(side*7.3,4.8,-i*15);
  scene.add(arm);

  const bulb=new THREE.Mesh(
   new THREE.SphereGeometry(.35,10,8),
   new THREE.MeshBasicMaterial({color:0xff00ff})
  );
  bulb.position.set(side*6.8,4.65,-i*15);
  scene.add(bulb);
  lamps.push(bulb);
 }
}

// Mashina yaratish
function makeCar(color=0xff2020){
 const car=new THREE.Group();
 const paint=new THREE.MeshStandardMaterial({color,metalness:.45,roughness:.25});

 const body=new THREE.Mesh(new THREE.BoxGeometry(1.8,.65,3.4),paint);
 body.position.y=.65;
 car.add(body);

 const cabin=new THREE.Mesh(new THREE.BoxGeometry(1.45,.65,1.65),glassMat);
 cabin.position.set(0,1.2,-.15);
 car.add(cabin);

 for(const z of [-1.8,1.8]){
  const bumper=new THREE.Mesh(new THREE.BoxGeometry(1.9,.2,.18),darkMat);
  bumper.position.set(0,.45,z);
  car.add(bumper);
 }

 for(const x of [-.96,.96]){
  for(const z of [-1.1,1.1]){
   const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.25,12),wheelMat);
   wheel.rotation.z=Math.PI/2;
   wheel.position.set(x,.4,z);
   car.add(wheel);
  }
 }

 const lightMat=new THREE.MeshBasicMaterial({color:0xffffcc});
 for(const x of [-.58,.58]){
  const light=new THREE.Mesh(new THREE.BoxGeometry(.35,.18,.08),lightMat);
  light.position.set(x,.75,-1.73);
  car.add(light);
 }
 return car;
}

// O'yinchi mashinasi
const player=makeCar(0xff2020);
player.position.set(0,0,4);
scene.add(player);

// Yo'ldagi mashinalar
const enemies=[];
const enemyColors=[0x168cff,0xffd000,0x21cc70,0xaa44ff,0xff7700];

function spawnEnemy(){
 if(enemies.length>=5)return;

 const e=makeCar(enemyColors[Math.floor(Math.random()*enemyColors.length)]);
 e.position.set([-3.5,0,3.5][Math.floor(Math.random()*3)],0,-100-Math.random()*45);
 scene.add(e);
 enemies.push(e);
}

// HAVODAGI TO'RTBURCHAK TO'SIQLAR
const airObstacles=[];
const obstacleGeometry=new THREE.BoxGeometry(2.4,1.5,1.3);
const obstacleMaterials=[
 new THREE.MeshStandardMaterial({color:0xff2525,emissive:0x660000}),
 new THREE.MeshStandardMaterial({color:0xff9900,emissive:0x552200}),
 new THREE.MeshStandardMaterial({color:0xff00ff,emissive:0x550055})
];

function spawnAirObstacle(){
 if(airObstacles.length>=6)return;

 const mat=obstacleMaterials[Math.floor(Math.random()*obstacleMaterials.length)];
 const obstacle=new THREE.Mesh(obstacleGeometry,mat);

 obstacle.position.set(
  (Math.random()-.5)*8,
  3+Math.random()*5,
  -100-Math.random()*35
 );

 scene.add(obstacle);
 airObstacles.push(obstacle);
}

// O'yin holati
let speed=0;
let distance=0;
let record=Number(localStorage.getItem("racingRecord")||0);
let steer=0;
let jumping=false;
let flying=false;
let flyTime=0;
let jumpVelocity=0;
let lastSpace=0;
let gameOver=false;
let gas=false,brake=false,left=false,right=false;
let spawnTimer=0;
let airSpawnTimer=0;
let messageTimer=0;

const speedEl=document.getElementById("speed");
const distanceEl=document.getElementById("distance");
const recordEl=document.getElementById("record");
const messageEl=document.getElementById("message");
recordEl.textContent=Math.floor(record);

function showMessage(t){
 messageEl.textContent=t;
 messageTimer=1.5;
}

// Klaviatura
const keys={};

addEventListener("keydown",e=>{
 keys[e.code]=true;

 if(e.code==="Space"){
  e.preventDefault();
  if(!e.repeat)spaceAction();
 }

 if(e.code.startsWith("Arrow"))e.preventDefault();
});

addEventListener("keyup",e=>keys[e.code]=false);

// Sakrash va uchish
function spaceAction(){
 const now=performance.now();

 if(now-lastSpace<350){
  flying=true;
  flyTime=60;
  jumping=false;
  jumpVelocity=0;
  player.position.y=5.5;
  showMessage("UCHISH BOSHLANDI! 60 SEC");
 }else{
  if(!flying&&!jumping){
   jumping=true;
   jumpVelocity=10;
  }
 }

 lastSpace=now;
}

// Telefon tugmalari
function bindButton(id,down,up){
 const el=document.getElementById(id);

 el.addEventListener("pointerdown",e=>{
  e.preventDefault();
  down();
 });

 el.addEventListener("pointerup",e=>{
  e.preventDefault();
  up();
 });

 el.addEventListener("pointerleave",up);
 el.addEventListener("pointercancel",up);
}

bindButton("left",()=>left=true,()=>left=false);
bindButton("right",()=>right=true,()=>right=false);
bindButton("gas",()=>gas=true,()=>gas=false);
bindButton("brake",()=>brake=true,()=>brake=false);

document.getElementById("jump").addEventListener("pointerdown",e=>{
 e.preventDefault();
 spaceAction();
});

// Qayta boshlash
function resetGame(){
 speed=0;
 distance=0;
 gameOver=false;
 player.position.set(0,0,4);
 jumping=false;
 flying=false;
 flyTime=0;
 jumpVelocity=0;

 enemies.forEach(e=>scene.remove(e));
 enemies.length=0;

 airObstacles.forEach(o=>scene.remove(o));
 airObstacles.length=0;

 spawnTimer=0;
 airSpawnTimer=0;
 showMessage("YANGI BOSHLANDI!");
}

// Asosiy o'yin sikli
let previous=performance.now();

function animate(now){
 requestAnimationFrame(animate);

 const dt=Math.min((now-previous)/1000,.04);
 previous=now;

 if(gameOver){
  renderer.render(scene,camera);
  return;
 }

 // Tezlanish va tormoz
 const accelerating=gas||keys["ArrowUp"]||keys["KeyW"];
 const braking=brake||keys["ArrowDown"]||keys["KeyS"];

 if(accelerating)speed+=300*dt;
 else speed-=70*dt;

 if(braking)speed-=850*dt;
 speed=THREE.MathUtils.clamp(speed,0,1000);

 // Burilish
 const l=left||keys["ArrowLeft"]||keys["KeyA"];
 const r=right||keys["ArrowRight"]||keys["KeyD"];

 steer=(r?1:0)-(l?1:0);
 player.position.x+=steer*(3.5+speed*.004)*dt;
 player.position.x=THREE.MathUtils.clamp(player.position.x,-4.6,4.6);
 player.rotation.z=THREE.MathUtils.lerp(player.rotation.z,-steer*.13,.15);

 // Sakrash
 if(jumping&&!flying){
  player.position.y+=jumpVelocity*dt;
  jumpVelocity-=23*dt;

  if(player.position.y<=0){
   player.position.y=0;
   jumping=false;
   jumpVelocity=0;
  }
 }

 // Uchish
 if(flying){
  flyTime-=dt;
  player.position.y=5.5+Math.sin(now*.004)*.35;

  if(flyTime<=0){
   flying=false;
   player.position.y=0;
   showMessage("UCHISH TUGADI");
  }
 }

 const movement=(speed/3.6)*.5*dt;

 // Yo'l chiziqlari harakati
 for(const m of laneMarks){
  m.position.z+=movement;
  if(m.position.z>8)m.position.z-=280;
 }

 // Chiroqlar harakati
 for(const lamp of lamps){
  lamp.position.z+=movement;
  if(lamp.position.z>10)lamp.position.z-=270;
  lamp.material.color.setHSL((now*.0002+lamp.position.z*.003)%1,1,.55);
 }

 // Yo'ldagi mashinalar
 spawnTimer+=dt;

 if(spawnTimer>1.15&&speed>80){
  spawnEnemy();
  spawnTimer=0;
 }

 for(let i=enemies.length-1;i>=0;i--){
  const e=enemies[i];
  e.position.z+=movement * 1;

  if(e.position.z>13){
   scene.remove(e);
   enemies.splice(i,1);
   continue;
  }

  const dx=Math.abs(e.position.x-player.position.x);
  const dz=Math.abs(e.position.z-player.position.z);

  if(dx<1.5&&dz<2.4&&player.position.y<1.3&&!flying){
   gameOver=true;
   speed=0;
   showMessage("TO'QNASHUV! — R NI BOSING");
  }
 }

 // HAVODAGI TO'SIQLARNI CHIQARISH
 if(flying){
  airSpawnTimer+=dt;

  if(airSpawnTimer>1.5){
   spawnAirObstacle();
   airSpawnTimer=0;
  }
 }

 // Havodagi to'siqlar harakati va to'qnashuv
 for(let i=airObstacles.length-1;i>=0;i--){
  const o=airObstacles[i];

  o.position.z+=movement;

  // To'siq aylanishi
  o.rotation.z+=dt*.15;

  // Ekrandan chiqsa o'chirish
  if(o.position.z>15){
   scene.remove(o);
   airObstacles.splice(i,1);
   continue;
  }

  // Faqat uchish rejimida havo to'sig'i bilan to'qnashuv
  const dx=Math.abs(o.position.x-player.position.x);
  const dy=Math.abs(o.position.y-player.position.y);
  const dz=Math.abs(o.position.z-player.position.z);

  if(flying&&dx<1.8&&dy<1.5&&dz<2){
   gameOver=true;
   speed=0;
   showMessage("HAVODAGI TO'SIQ! — R NI BOSING");
  }
 }

 // Masofa va rekord
 distance+=(speed/3.6)*dt*.35;
 const d=Math.floor(distance);

 if(d>record){
  record=d;
  localStorage.setItem("racingRecord",record);
 }

 speedEl.textContent=Math.floor(speed);
 distanceEl.textContent=d;
 recordEl.textContent=record;

 // Kamera
 camera.position.x=THREE.MathUtils.lerp(camera.position.x,player.position.x*.45,.06);
 camera.position.y=THREE.MathUtils.lerp(camera.position.y,5.5+player.position.y*.3,.06);
 camera.lookAt(player.position.x*.3,1.3,-5);

 if(messageTimer>0){
  messageTimer-=dt;
  if(messageTimer<=0)messageEl.textContent="";
 }

 renderer.render(scene,camera);
}

requestAnimationFrame(animate);

// R tugmasi bilan qayta boshlash
addEventListener("keydown",e=>{
 if(e.code==="KeyR"&&gameOver)resetGame();
});

// Oyna o'lchami
addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.2));
});

showMessage("GAZNI BOSIB BOSHLANG!");
</script>
</body>
</html>
