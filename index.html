<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moments</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #101827, #172d38, #102a25);
    color: white;
    min-height: 100vh;
    overflow-x: hidden;
}

/* ASOSIY TUZILISH */
.container {
    display: flex;
    min-height: 100vh;
}

/* CHAP MENYU */
.sidebar {
    width: 250px;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(15px);
    padding: 35px 20px;
    border-right: 1px solid rgba(255,255,255,0.1);
}

.logo {
    font-size: 27px;
    font-weight: bold;
    text-align: center;
    margin-bottom: 55px;
    letter-spacing: 3px;
    color: #4ade80;
}

.menu button {
    width: 100%;
    padding: 16px;
    margin-bottom: 12px;
    border: none;
    border-radius: 12px;
    background: transparent;
    color: white;
    font-size: 16px;
    text-align: left;
    cursor: pointer;
    transition: 0.3s;
}

.menu button:hover,
.menu button.active {
    background: #16a34a;
    transform: translateX(5px);
}

/* O'NG TOMON */
.main {
    flex: 1;
    padding: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* SAHIFALAR */
.page {
    display: none;
    width: 100%;
    max-width: 900px;
    text-align: center;
    animation: fade 0.5s ease;
}

.page.active {
    display: block;
}

@keyframes fade {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

/* BOSHLASH TUGMASI */
.start-btn {
    padding: 24px 75px;
    border: none;
    border-radius: 18px;
    background: #16a34a;
    color: white;
    font-size: 27px;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 10px 35px rgba(22,163,74,0.4);
    transition: 0.3s;
}

.start-btn:hover {
    transform: scale(1.07);
    background: #15803d;
}

.start-btn:disabled {
    background: #dc2626;
    cursor: default;
    transform: scale(1);
    box-shadow: 0 10px 35px rgba(220,38,38,0.4);
}

/* SANOQ */
.countdown {
    font-size: 130px;
    font-weight: bold;
    color: #4ade80;
    margin-top: 35px;
    display: none;
    text-shadow: 0 0 35px rgba(74,222,128,0.7);
}

.countdown.show {
    display: block;
    animation: countAnimation 0.8s ease;
}

@keyframes countAnimation {
    0% { transform: scale(2); opacity: 0; }
    50% { transform: scale(1); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
}

/* MUSIQA HOLATI */
.music-status {
    margin-top: 30px;
    font-size: 19px;
    color: #4ade80;
    display: none;
}

.music-status.show {
    display: block;
}

/* RASMLAR */
.page img {
    display: block;
    max-width: 100%;
    max-height: 65vh;
    object-fit: contain;
    margin: 25px auto;
    border-radius: 18px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.4);
}

.page-title {
    font-size: 32px;
    color: #4ade80;
    margin-bottom: 20px;
}

/* MUSIQA BOSHQARUVI */
.music-controls {
    margin-top: 25px;
}

.music-controls button {
    padding: 12px 25px;
    border: none;
    border-radius: 10px;
    background: #16a34a;
    color: white;
    cursor: pointer;
    font-size: 16px;
}

.music-controls button:hover {
    background: #15803d;
}

/* TELEFON */
@media(max-width: 700px) {
    .container {
        flex-direction: column;
    }

    .sidebar {
        width: 100%;
        padding: 15px;
    }

    .logo {
        margin-bottom: 15px;
    }

    .menu {
        display: flex;
        gap: 5px;
    }

    .menu button {
        text-align: center;
        padding: 12px 5px;
        font-size: 13px;
        margin: 0;
    }

    .main {
        padding: 25px 15px;
        min-height: 65vh;
    }

    .start-btn {
        padding: 20px 45px;
        font-size: 22px;
    }

    .countdown {
        font-size: 100px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- CHAP MENYU -->
    <aside class="sidebar">

        <div class="logo">MOMENTS</div>

        <div class="menu">
            <button class="active" onclick="showPage('home', this)">
                🏠 Asosiy
            </button>

            <button onclick="showPage('photos', this)">
                🖼 Rasmlar
            </button>

            <button onclick="showPage('info', this)">
                ℹ Ma'lumot
            </button>
        </div>

    </aside>


    <!-- ASOSIY QISM -->
    <main class="main">

        <!-- ASOSIY SAHIFA -->
        <section class="page active" id="home">

            <button class="start-btn" id="startBtn" onclick="startMusic()">
                BOSHLASH
            </button>

            <div class="countdown" id="countdown"></div>

            <div class="music-status" id="musicStatus">
                ♪ Musiqa ijro etilmoqda...
            </div>

            <div class="music-controls" id="musicControls" style="display:none;">
                <button onclick="toggleMusic()" id="pauseBtn">
                    ⏸ Pauza
                </button>
            </div>

        </section>


        <!-- RASMLAR SAHIFASI -->
        <section class="page" id="photos">

            <h1 class="page-title">Rasmlar</h1>

            <!-- BU YERGA RASMLAR RASMINI JOYLASHTIR -->
            <img src="Skrinshot 2026-10-19 203634.png" alt="Rasmlar sahifasi rasmi">

        </section>


        <!-- MA'LUMOT SAHIFASI -->
        <section class="page" id="info">

            <h1 class="page-title">Ma'lumot</h1>

            <!-- BU YERGA MA'LUMOT RASMINI JOYLASHTIR -->
            <img src="Skrinshot 2026-10-19 203634.png" alt="Ma'lumot sahifasi rasmi">

        </section>

    </main>

</div>


<!-- MP3 MUSIQA FAYLI -->
<!-- O'ZINGNING MP3 FAYLINGNI assets/music.mp3 NOMI BILAN JOYLASHTIR -->
<audio id="music" src="ahhhh-girl.mp3" preload="auto"></audio>


<script>

// SAHIFALAR O'RTASIDA O'TISH
function showPage(pageId, button) {

    document.querySelectorAll('.page').forEach(page => {
        page.classList.remove('active');
    });

    document.getElementById(pageId).classList.add('active');

    document.querySelectorAll('.menu button').forEach(btn => {
        btn.classList.remove('active');
    });

    button.classList.add('active');
}


// BOSHLASH VA SANOQ
let started = false;

function startMusic() {

    if (started) return;

    started = true;

    const btn = document.getElementById('startBtn');
    const countdown = document.getElementById('countdown');

    // TUGMA QIZIL RANGGA O'TADI
    btn.disabled = true;
    btn.innerText = "BOSHLANDI";

    // 3, 2, 1 SANOQ
    let number = 3;

    countdown.style.display = "block";

    function count() {

        countdown.innerText = number;

        countdown.classList.remove('show');

        // Animatsiyani qayta ishga tushirish
        void countdown.offsetWidth;

        countdown.classList.add('show');

        if (number > 1) {

            number--;

            setTimeout(count, 1000);

        } else {

            setTimeout(playMusic, 1000);

        }
    }

    count();
}


// MP3 NI ISHGA TUSHIRISH
function playMusic() {

    const music = document.getElementById('music');

    document.getElementById('countdown').style.display = "none";

    music.play().then(() => {

        document.getElementById('musicStatus').classList.add('show');

        document.getElementById('musicControls').style.display = "block";

    }).catch(() => {

        alert("MP3 fayl topilmadi yoki ijro etilmadi. assets/music.mp3 manzilini tekshiring.");

        started = false;

        document.getElementById('startBtn').disabled = false;
        document.getElementById('startBtn').innerText = "BOSHLASH";

    });
}


// PAUZA VA DAVOM ETTIRISH
function toggleMusic() {

    const music = document.getElementById('music');
    const btn = document.getElementById('pauseBtn');

    if (music.paused) {

        music.play();

        btn.innerText = "⏸ Pauza";

    } else {

        music.pause();

        btn.innerText = "▶ Davom ettirish";

    }
}

</script>

</body>
</html>
